name: Deploy to production

# Manual only - press "Run workflow" on the Actions tab.
# To deploy automatically on every push to main, add these two lines under `on:`
#   push:
#     branches: [main]
on:
  workflow_dispatch:

# Never run two deploys at once.
concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to EC2
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Set up SSH
        run: |
          mkdir -p ~/.ssh
          # The key is stored base64-encoded on one line, so copy-and-paste
          # cannot break its line endings. Decode it back here.
          printf '%s' "${{ secrets.DEPLOY_SSH_KEY }}" | base64 -d > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          # Fail here, with a clear message, if the key did not survive.
          ssh-keygen -y -f ~/.ssh/deploy_key > /dev/null \
            || { echo "DEPLOY_SSH_KEY is not a valid private key"; exit 1; }
          printf '%s\n' "${{ secrets.DEPLOY_HOST_KEY }}" > ~/.ssh/deploy_known_hosts
          chmod 600 ~/.ssh/deploy_known_hosts

      # The deploy script lives on the server, outside the repository, so a
      # change to this file cannot run arbitrary commands on the server.
      - name: Run the deploy script on the server
        run: |
          ssh -i ~/.ssh/deploy_key \
              -o UserKnownHostsFile=~/.ssh/deploy_known_hosts \
              -o StrictHostKeyChecking=yes \
              -o BatchMode=yes \
              "ubuntu@${{ secrets.DEPLOY_HOST }}" \
              'bash ~/deploy.sh'

      - name: Remove the key from the runner
        if: always()
        run: rm -f ~/.ssh/deploy_key ~/.ssh/deploy_known_hosts
